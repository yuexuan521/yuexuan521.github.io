name: github pages

on:
  push:
    branches:
      - master          # 只有 master 的提交会发布
  workflow_dispatch:     # 允许在 Actions 页面手动触发（需选 master 分支）

permissions:
  contents: write

# 同一时间只跑一个部署，新提交会取消排队中的旧任务
concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true   # 主题 PaperMod 是子模块
          fetch-depth: 0     # 完整历史，用于生成"最后修改时间"

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.160.1'   # 与本地一致，避免产物漂移
          extended: true

      - name: Build
        run: hugo --minify

      # 1) GitHub Pages 只认站点根目录的 /404.html；本项目 defaultContentLanguageInSubdir = true，
      #    Hugo 只生成 /zh/404.html，因此复制一份到根目录，否则线上会显示 GitHub 默认 404。
      # 2) 英文站已收起（页面 noindex，且不在 sitemap 索引里），这里顺手删掉它的 sitemap，
      #    避免被直接访问到一份只含未完成内容的清单。
      - name: Prepare publish artifacts
        run: |
          if [ -f public/zh/404.html ]; then
            cp public/zh/404.html public/404.html
            echo "root 404 ready: $(wc -c < public/404.html) bytes"
          else
            echo "::error::public/zh/404.html not found"
            exit 1
          fi
          rm -f public/en/sitemap.xml
          echo "en sitemap removed (if any)"

      - name: Deploy
        if: github.ref == 'refs/heads/master'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./public
