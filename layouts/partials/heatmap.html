{{/* 文章日历热力图：仅返回片段，样式见 assets/css/extended/custom.css */}}
<div class="heatmap-container">
    <div class="heatmap-head">
        <p class="heatmap-title">{{ i18n "article_activity" }}</p>
        <select id="yearSelector" aria-label="选择年份"></select>
    </div>
    <div id="heatmap"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/echarts@5.3.0/dist/echarts.min.js"></script>
<script>
    (function () {
        var myChart;

        function getCurrentTheme() {
            var attr = document.documentElement.getAttribute("data-theme");
            if (attr === "dark" || attr === "light") return attr;
            return document.body.classList.contains("dark") ? "dark" : "light";
        }

        function cssVar(name) {
            return getComputedStyle(document.documentElement).getPropertyValue(name).trim();
        }

        function themeColors() {
            var suffix = getCurrentTheme() === "dark" ? "dark" : "light";
            return [
                cssVar("--heatmap-colors-" + suffix + "-0"),
                cssVar("--heatmap-colors-" + suffix + "-1"),
                cssVar("--heatmap-colors-" + suffix + "-2"),
                cssVar("--heatmap-colors-" + suffix + "-3")
            ];
        }

        function bgColor() {
            return cssVar(getCurrentTheme() === "dark" ? "--heatmap-bg-dark" : "--heatmap-bg-light");
        }

        function tooltipBg() {
            return cssVar(getCurrentTheme() === "dark" ? "--tooltip-bg-dark" : "--tooltip-bg-light");
        }

        function tooltipText() {
            return cssVar(getCurrentTheme() === "dark" ? "--tooltip-textstyle-dark" : "--tooltip-textstyle-light");
        }

        function populatePostData() {
            var postsByDate = new Map();
            var years = new Set();
            {{- range (where .Site.RegularPages "Type" "post") }}
            (function () {
                var date = {{ .Date.Format "2006-01-02" | jsonify | safeJS }};
                var year = {{ .Date.Format "2006" | jsonify | safeJS }};
                years.add(year);
                var data = postsByDate.get(date);
                if (data === undefined) {
                    data = { posts: [], totalWordCount: 0 };
                }
                data.posts.push({
                    title: {{ .Title | jsonify | safeJS }},
                    link: {{ .RelPermalink | jsonify | safeJS }},
                    wordCount: {{ .WordCount }}
                });
                data.totalWordCount += {{ .WordCount }};
                postsByDate.set(date, data);
            })();
            {{- end }}

            return [postsByDate, Array.from(years).sort().reverse()];
        }

        function heatmapData(year) {
            var out = [];
            postsByDate.forEach(function (data, date) {
                if (date.indexOf(year) === 0) out.push([date, data.totalWordCount]);
            });
            return out;
        }

        function initChart() {
            if (myChart) myChart.dispose();
            myChart = echarts.init(document.getElementById("heatmap"), getCurrentTheme() === "dark" ? "dark" : "light");
            option.visualMap.inRange.color = themeColors();
            option.calendar.itemStyle.color = bgColor();
            option.calendar.itemStyle.borderColor = getCurrentTheme() === "dark" ? "#3a3a40" : "#ececea";
            option.tooltip.backgroundColor = tooltipBg();
            option.tooltip.textStyle.color = tooltipText();
            myChart.setOption(option);
        }

        var postsByDate, years, latestYear, option;

        function boot() {
            var data = populatePostData();
            postsByDate = data[0];
            years = data[1];
            latestYear = years.length ? years[0] : String(new Date().getFullYear());

            option = {
                backgroundColor: "transparent",
                title: { show: false },
                visualMap: {
                    show: false, min: 0, max: 10000, type: "piecewise",
                    inRange: { color: themeColors() }
                },
                calendar: {
                    top: 20, left: 36, right: 36, bottom: 10,
                    cellSize: ["auto", "auto"],
                    range: latestYear,
                    itemStyle: {
                        color: bgColor(),
                        borderWidth: 1,
                        borderColor: getCurrentTheme() === "dark" ? "#3a3a40" : "#ececea"
                    },
                    yearLabel: { show: false },
                    dayLabel: { firstDay: 1, nameMap: {{ .Lang | jsonify | safeJS }} },
                    monthLabel: { nameMap: {{ .Lang | jsonify | safeJS }} },
                    splitLine: { show: false }
                },
                tooltip: {
                    hideDelay: 1000,
                    enterable: true,
                    textStyle: { color: tooltipText() },
                    backgroundColor: tooltipBg(),
                    formatter: function (params) {
                        var thousandWordsText = {{ i18n "thousand_words" | jsonify | safeJS }};
                        var date = params.data[0];
                        var posts = postsByDate.get(date).posts;
                        var html = date;
                        posts.forEach(function (p) {
                            var k = (p.wordCount / 1000).toFixed(1);
                            html += '<br><a href="' + p.link + '" target="_blank">' + p.title + " | " + k + thousandWordsText + "</a>";
                        });
                        return html;
                    }
                },
                series: {
                    type: "heatmap",
                    coordinateSystem: "calendar",
                    calendarIndex: 0,
                    data: heatmapData(latestYear)
                }
            };

            var sel = document.getElementById("yearSelector");
            years.forEach(function (y) {
                var o = document.createElement("option");
                o.value = y; o.text = y;
                sel.appendChild(o);
            });
            sel.addEventListener("change", function () {
                option.calendar.range = this.value;
                option.series.data = heatmapData(this.value);
                myChart.setOption(option);
            });

            initChart();

            new MutationObserver(function (ms) {
                ms.forEach(function (m) {
                    if (m.type === "attributes" && m.attributeName === "data-theme") initChart();
                });
            }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });

            window.addEventListener("resize", function () { if (myChart) myChart.resize(); });
        }

        if (document.readyState === "loading") {
            document.addEventListener("DOMContentLoaded", boot);
        } else {
            boot();
        }
    })();
</script>
