{{- /*只有在文章页面且开启评论时才显示*/ -}}
{{- if .Param "comments" -}}
<div class="comments">
  <div class="title">
    <span>Comments</span>
    <span class="counter"><span class="remark42__counter" data-url="{{ .Permalink }}"></span></span>
  </div>
  
  {{- /* 定义 Giscus 的容器 */ -}}
  <script src="https://giscus.app/client.js"
          data-repo="{{ site.Params.giscus.repo }}"
          data-repo-id="{{ site.Params.giscus.repoId }}"
          data-category="{{ site.Params.giscus.category }}"
          data-category-id="{{ site.Params.giscus.categoryId }}"
          data-mapping="pathname"
          data-strict="0"
          data-reactions-enabled="1"
          data-emit-metadata="0"
          data-input-position="bottom"
          data-theme="preferred_color_scheme" 
          data-lang="zh-CN"
          crossorigin="anonymous"
          async>
  </script>

  {{- /* 下面是自动切换主题的核心 JS 代码 */ -}}
  <script>
    // 1. 定义两个主题对应的 Giscus 主题名
    // 你可以在 https://giscus.app/zh-CN 找到更多主题名，比如 'noborder_dark', 'transparent_dark'
    const giscusLight = 'light';
    const giscusDark = 'dark_dimmed'; // 或者 'dark', 'transparent_dark' (配合你的深色背景)

    // 2. 获取当前博客的主题状态
    function getGiscusTheme() {
        // PaperMod 在 body 上加了 class="dark" 来表示深色模式
        return document.body.classList.contains('dark') ? giscusDark : giscusLight;
    }

    // 3. 设置 Giscus 的主题 (发送消息给 iframe)
    function setGiscusTheme() {
        const iframe = document.querySelector('iframe.giscus-frame');
        if (!iframe) return;
        
        const theme = getGiscusTheme();
        iframe.contentWindow.postMessage({
            giscus: {
                setConfig: {
                    theme: theme
                }
            }
        }, 'https://giscus.app');
    }

    // 4. 初始化：加载时先设置一次
    // 这里的 trick 是等待 iframe 加载完毕后再发消息，或者直接利用 giscus 的 data-theme="preferred_color_scheme"
    // 但为了保险，我们还是动态改一下
    document.querySelector('script[src="https://giscus.app/client.js"]').setAttribute('data-theme', getGiscusTheme());

    // 5. 监听：当用户点击右上角切换按钮时触发
    const themeToggle = document.querySelector('#theme-toggle');
    if (themeToggle) {
        themeToggle.addEventListener('click', () => {
            // 给一点点延迟，等待 PaperMod 完成 class 的切换
            setTimeout(setGiscusTheme, 200);
        });
    }

    // 6. 监听：系统主题变化 (比如电脑从白天自动变黑夜)
    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
        // 只有在用户选择了 "auto" 模式下才需要这个，不过加上也无妨
        if (localStorage.getItem("pref-theme") === "auto" || !localStorage.getItem("pref-theme")) {
             setTimeout(setGiscusTheme, 200);
        }
    });
  </script>
</div>
{{- end -}}
