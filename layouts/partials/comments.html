<section>
  <h2>Comments</h2>
  <div id="comments-giscus"></div>
</section>

<script>
  // 1. 简化的获取主题函数 (只针对 PaperMod)
  function getPaperModTheme() {
      // PaperMod 这里的逻辑很简单：body 有 dark 类就是深色，没有就是浅色
      return document.body.classList.contains('dark') ? 'dark' : 'light';
  }

  // 2. 发送指令给 Giscus (无刷新切换)
  function updateGiscusTheme() {
      const iframe = document.querySelector('iframe.giscus-frame');
      const theme = getPaperModTheme();
      
      if (!iframe) {
          console.warn('[Giscus] 未找到 iframe，跳过主题切换');
          return;
      }

      console.log(`[Giscus] 正在切换主题为: ${theme}`);
      
      // 发送 postMessage
      iframe.contentWindow.postMessage({
          giscus: {
              setConfig: {
                  theme: theme
              }
          }
      }, 'https://giscus.app');
  }

  // 3. 加载 Giscus 脚本
  function loadGiscus() {
      const container = document.getElementById("comments-giscus");
      if (!container || container.hasAttribute('data-giscus-loaded')) return;

      const isChinese = "{{.Lang}}" == "zh";
      const currentTheme = getPaperModTheme();

      const script = document.createElement("script");
      script.src = "https://giscus.app/client.js";
      script.setAttribute("data-repo", "{{ .Site.Params.giscus.repo }}");
      script.setAttribute("data-repo-id", "{{ .Site.Params.giscus.repoId }}");
      script.setAttribute("data-category", "{{ .Site.Params.giscus.category }}");
      script.setAttribute("data-category-id", "{{ .Site.Params.giscus.categoryId }}");
      script.setAttribute("data-mapping", "pathname");
      script.setAttribute("data-strict", "0");
      script.setAttribute("data-reactions-enabled", "1");
      script.setAttribute("data-emit-metadata", "0");
      script.setAttribute("data-input-position", "bottom");
      script.setAttribute("data-theme", currentTheme); // 初始主题
      script.setAttribute("data-lang", isChinese ? "zh-CN" : "en");
      script.setAttribute("crossorigin", "anonymous");
      script.setAttribute("async", "true");
      
      container.appendChild(script);
      container.setAttribute('data-giscus-loaded', 'true');
  }

  // 4. 执行初始化
  loadGiscus();

  // 5. 双重保险监听机制

  // 保险一：直接监听右上角的切换按钮点击事件
  const toggleBtn = document.querySelector("#theme-toggle");
  if (toggleBtn) {
      toggleBtn.addEventListener("click", () => {
          // 延迟 200ms，等待 PaperMod 完成样式切换后再通知 Giscus
          setTimeout(updateGiscusTheme, 200);
      });
  }

  // 保险二：MutationObserver 监听 body class 变化
  const observer = new MutationObserver((mutations) => {
      mutations.forEach((mutation) => {
          if (mutation.type === 'attributes' && mutation.attributeName === 'class') {
              updateGiscusTheme();
          }
      });
  });
  
  observer.observe(document.body, { 
      attributes: true, 
      attributeFilter: ['class'] 
  });

</script>
