markup:
  # https://github.com/adityatelange/hugo-PaperMod/issues/1386
  highlight:                # 代码高亮设置
    noClasses: false        # 必须为 false，否则 CSS 样式不生效
    # anchorLineNos: true
    codeFences: true        # 支持 ``` 代码块。
    guessSyntax: true       # 自动猜测代码语言。
    lineNos: true           # 是否显示行号 (建议 true)
    style: modus-operandi # useless, need to set custom css
    tabWidth: 4             # Tab 缩进宽度
  goldmark:
    renderer:
      unsafe: true          # 【重要】允许在 Markdown 里写 HTML 
  home:
    - HTML                  # 生成 HTML 网页。
    - RSS                   # 生成 RSS 订阅源。
    - JSON # is necessary   # 生成 index.json (用于站内搜索，不可删除)。

permalinks:
  # 优化永久链接 Permalinks
  post: "/posts/:contentbasename/" 
  # 或者 "/posts/:slug/"