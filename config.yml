baseURL: https://yuexuan521.github.io  # 【关键】网站的网址。必须完全匹配，结尾不要带斜杠
title: "less but better"  # 浏览器标签页显示的标题
pagination:
  pagerSize: 5 # 每页显示几篇文章。如果觉得太少，改成 10
theme: PaperMod # 指定使用的主题。对应 themes/PaperMod 文件夹

# --- 作者信息 (Global) ---
author:
  name: Yue Xuan        # 全局默认作者名。如果文章没指定作者，就用这个。
languageCode: en-us     # 网站主要语言代码 (用于 HTML <html lang="en-us">)。
rssLimit: 10            # RSS 订阅源中最多显示最新的 10 篇文章。
enableRobotsTXT: true   # 是否生成 robots.txt（允许搜索引擎抓取）
buildDrafts: false      # 是否构建“草稿”。设为 true 则即使文章头有 draft: true 也会显示
buildFuture: false      # 是否发布日期在未来的文章。True=即使日期是明天也现在发布。
buildExpired: false     # 是否发布已过期的文章 (在文章头设置了
hasCJKLanguage: true # has chinese/japanese/korean ? # 【重要】开启中日韩语言支持。开启后，字数统计对中文才准确

googleAnalytics: "G-ZJJPFY9FCD"  # 谷歌统计 ID。直接填 ID 即可开启统计，不需要时填空或删除。

# --- 压缩设置 (优化加载速度) ---
minify:
  disableXML: true      # 是否禁用 XML 压缩 (True=不压缩)。通常 XML 不压缩也没事。
  minifyOutput: true    # 是否压缩生成的 HTML 文件 (去除多余空格换行)。建议开启(true)。

params:
  env: production # to enable google analytics, opengraph, twitter-cards and schema. # 环境标识。Production (生产环境) 会开启统计、压缩等；
  title: "YueXUan's Blog" # 首页显示的网站标题
  description: "关注网络安全、CTF Writeup、渗透测试与编程技术分享。" # 网站描述（用于 SEO 搜索结果摘要）用于 HTML meta description，对 SEO 极其重要。
  keywords: [博客, Life, Enginering, CTF, 网络安全, Writeup, Web安全, Hugo, 渗透测试] # 网站关键词。用于 SEO。
  author: Yue Xuan # 显示在页面底部的作者名。
  # author: ["Me", "You"] # multiple authors
  images: ["<link or path of image for opengraph, twitter-cards>"] # 默认的社交分享预览图 (OpenGraph Image)。当文章没有封面图时，分享到微信/推特显示这张图。
  DateFormat: "January 2, 2006" # 日期显示格式。Go 语言特有的时间格式化字符串。
  math: true # 【重要】开启 LaTeX 数学公式渲染 (KaTeX)。如果你写算法或数学公式，必须为 true。
  defaultTheme: auto # dark, light # 主题模式：auto (跟随系统), dark (强制深色), light (强制浅色)
  disableThemeToggle: false # 是否禁用右上角的“日/夜”切换按钮。false = 不禁用（显示按钮）
  
  # --- 文章页面功能开关 (True=开启, False=关闭) ---
  ShowFullTextInRSS: true                # RSS 订阅源里是否显示全文。True=全文，False=只显示摘要。
  ShowReadingTime: true                  # 文章标题下显示“预计阅读时间” (例如: 5 min read)。
  ShowShareButtons: true                 # 显示底部的分享按钮 (Twitter, Facebook等)
  ShowPostNavLinks: true                 # 显示“上一篇/下一篇”链接
  ShowBreadCrumbs: true                  # 显示面包屑导航 (主页 > post > 文章名)
  hideAuthor: true                       # 【重要】在文章标题下是否隐藏作者名。True=不显示作者。
  ShowCodeCopyButtons: true             # 【建议改成 true】显示代码块右上角的“复制”按钮
  ShowWordCount: true                    # 显示文章字数统计
  ShowRssButtonInSectionTermList: true   # 在列表页显示 RSS 按钮。
  UseHugoToc: true                       # 使用 Hugo 原生目录生成器 (必须开启)
  disableSpecial1stPost: false           # PaperMod 默认会把列表页的第一篇文章放大显示。True=禁用此特效，所有文章一样大。
  disableScrollToTop: false              # 是否禁用右下角的“回到顶部”箭头按钮。
  hidemeta: false                        # 【总开关】是否隐藏所有元数据 (日期、字数、时间)。
  hideSummary: false                     # 在首页/列表页，是否隐藏文章摘要。True=只显示标题。
  comments: true                         # 【总开关】是否开启评论。具体配置在后面 giscus 部分
   # --- 目录 (Table of Contents) 设置 ---
  showtoc: true                          # 是否默认显示右侧目录
  tocopen: true                          # 目录默认是展开(true)还是折叠(false)

  assets:
    disableHLJS: true # to disable highlight.js 【重要】禁用主题自带的 Highlight.js # 因为 Hugo 现在内置了 Chroma 高亮 (在 markup 里配置)，通常建议设为 true 以避免冲突。
    # disableFingerprinting: true     # 是否禁用资源哈希 (用于缓存控制)。通常不需要动。
    favicon: "/favicon.ico"                     # 浏览器标签页的小图标 (16x16 或 32x32)。
    favicon16x16:  "/favicon-16x16.png"
    favicon32x32:  "/favicon-32x32.png"
    apple_touch_icon:  "/apple-touch-icon.png"  # 添加到 iPhone 主屏幕时显示的图标。
    safari_pinned_tab: "<link / abs url>"       # Safari 浏览器的固定标签页图标 (SVG)。

  label:
    text: "Home"                  # 左上角网站Logo旁边的文字 (通常显示网站名)。
    icon: /apple-touch-icon.png   # 左上角文字旁边的图片 (比如你的头像)。
    iconHeight: 35                # 图标高度。

# --- 模式 A: 个人资料模式 (当前被禁用) ---
  # profile-mode
  profileMode:
    enabled: false # needs to be explicitly set # 必须设为 true 才能启用。启用后要删掉下面的 homeInfoParams。
    title: ExampleSite            # 大标题
    subtitle: "This is subtitle"  # 副标题
    imageUrl: "<img location>"    # 圆形大头像路径
    imageWidth: 120
    imageHeight: 120
    imageTitle: my image
    buttons:                      # 下方的按钮列表
      - name: Posts
        url: posts
      - name: 标签
        url: 标签

# --- 模式 B: 图文介绍模式 (当前正在使用) ---
  # home-info mode
  homeInfoParams:
    Title: "Hi there \U0001F44B" # 首页欢迎语。\U0001F44B 是 👋 的 Unicode 编码
    Content: >                   # 首页介绍文案。 > 表示后面是多行文本。
      The true secret of happiness lies in taking a genuine interest in all the details of daily life. \

      _-- **Yue Xuan Blog**_

  analytics:        # 其他统计平台验证 (用于站长平台验证所有权)。
    google:
      SiteVerificationTag: "XYZabc"
    bing:
      SiteVerificationTag: "XYZabc"
    yandex:
      SiteVerificationTag: "XYZabc"

  cover:         # 文章封面图的全局默认设置。
    hidden: true # hide everywhere but not in structured data # 是否默认隐藏封面图。
    hiddenInList: true # hide on list pages and home # 在列表页隐藏封面。
    hiddenInSingle: true # hide on single page # 在文章详情页隐藏封面。

  editPost: # “建议修改”功能
    URL: "https://github.com/yuexuan521/yuexuan521.github.io/master/content" # 点击按钮跳转的 GitHub 源码地址。
    Text: "Suggest Changes" # edit text # 按钮显示的文字。
    appendFilePath: true # to append file path to Edit link # 是否自动在 URL 后拼接当前文件的路径。

  # --- 搜索功能 (Fuse.js) 设置 ---
  # for search
  # https://fusejs.io/api/options.html
  fuseOpts:
    isCaseSensitive: false        # 搜索是否区分大小写 (False=不区分)。
    shouldSort: true              # 搜索结果是否按相关度排序。
    location: 0                   # 模糊匹配参数 (建议保持默认)。
    distance: 1000                # 模糊匹配距离 (建议保持默认)。
    threshold: 0.4                # 匹配阈值：0=完全匹配，1=匹配任何东西。0.4 是比较好的
    minMatchCharLength: 0         # 最少输入几个字符才开始搜索。
    keys: ["title", "permalink", "summary", "content"] # 搜索哪些内容 (标题、链接、摘要、正文)。

  # --- 评论系统 (Giscus) ---
  giscus:
    repo: "yuexuan521/Comment"           # 【必改】你用来存放评论的 GitHub 仓库
    repoId: "R_kgDOQerVlg"               # Giscus 生成的 ID
    category: "General"                  # Discussion 分类名。
    categoryId: "DIC_kwDOQerVls4CzJw8"   # 分类 ID。

  # --- 社交图标 (左侧或底部) ---
  socialIcons:
    - name: github                           # 图标名称 (对应 simple-icons)。
      url: "https://github.com/yuexuan521"   # 跳转链接。
    - name: email
      url: "mailto:yuexuan521@gmail.com"
    # 新增 PGP 公钥
    - name: pgp
      url: "/yuexuan_0x780098B1_public.asc"  # 对应 static 目录下的文件名
    #- name: stackoverflow
    #  url: ""
    #- name: x
    #  url: ""
    #- name: linkedin
    #  url: ""
    #- name: telegram
    #  url: ""
    #- name: csdn
    #  url: "https://yuexuan.blog.csdn.net/"
defaultContentLanguageInSubdir: true # 【重要】是否将默认语言放在子目录。
                                     # True = 访问首页自动跳转 /en/ 或 /zh/。
                                     # False = 默认语言直接显示在根目录，其他语言在子目录。
copyright: "See this site's source code [here](https://github.com/yuexuan521/yuexuan521.github.io), licensed under GPLv3 ·"  # 页脚版权信息支持 Markdown。
defaultContentLanguage: zh  # 默认语言。
